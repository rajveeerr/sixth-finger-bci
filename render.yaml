# The streaming inference server (server/) on Render, as a Blueprint: in Render choose
# New > Blueprint and pick this repository. Only server/ is installed (not the research
# environment); the demo bundle is read from web/public/demo in the same checkout. The
# free plan sleeps after 15 minutes without visitors; the demo page wakes it and decodes
# in the browser until it answers.
services:
  - type: web
    name: sixth-finger-bci-server
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    buildCommand: uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://sixthfinger.rajveers.com,https://sixth-finger-bci.vercel.app
      - key: MAX_STREAMS
        value: "8"
