[project]
name = "sixthfinger-server"
version = "0.1.0"
description = "Inference and streaming service for the Sixth-Finger BCI demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "numpy>=2.5.3",
    "onnxruntime==1.30.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
