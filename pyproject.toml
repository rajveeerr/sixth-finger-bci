[project]
name = "sixthfinger"
version = "0.1.0"
description = "EEG decoding of affected-hand and sixth-finger motor imagery, calibration-efficiency study and a 3D control demo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rajveer Singh" },
    { name = "Vivek Yadav" },
    { name = "Ansh Dahiya" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "mne==1.13.2",
    "pymatreader==1.3.2",
    "scikit-learn==1.9.1",
    "pyriemann==0.12",
    # torchaudio (required by braindecode) stops at 2.11; torch must match it or
    # braindecode fails to import on Linux.
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "braindecode==1.8.1",
    "onnx==1.23.1",
    "onnxruntime==1.30.0",
    "pydantic==2.13.5",
    "pyyaml>=6.0",
    "typer==0.27.2",
    "requests>=2.32",
    "tqdm>=4.66",
    "matplotlib==3.11.2",
    "pingouin==0.7.0",
    "statsmodels==0.15.0",
]

[project.optional-dependencies]
moabb = ["moabb==1.7.2"]

[project.scripts]
sixthfinger = "sixthfinger.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pre-commit==4.6.2",
    "nbstripout==0.9.1",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "remotezip==0.12.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sixthfinger"]

# Linux machines (CI, Kaggle images that use uv) get the CPU-only torch wheel,
# which is ~10x smaller than the default CUDA build. macOS and Windows use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["_workspace"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = [
    "RUF001", # µ and – appear in docstrings about units
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["sixthfinger"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"notebooks/**" = ["E402", "B018"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: needs the downloaded dataset under data/processed (skipped otherwise)",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:pymatreader.*",
    # braindecode 1.8.1 still asks MNE for the deprecated standard_1020 montage at import.
    "ignore:Montage name 'standard_1020' is deprecated:FutureWarning",
]
