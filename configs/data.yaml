# Dataset: Wang et al., Scientific Data 13, 1109 (2026); figshare 10.6084/m9.figshare.30509165 (CC BY 4.0)

figshare:
  article_id: 30509165
  version: 11
  download_url: "https://ndownloader.figshare.com/files/{file_id}"
  api_url: "https://api.figshare.com/v2/articles/{article_id}"
  archives:
    processeddata:
      file_id: 64870068
      filename: processeddata.zip
      size_bytes: 3511450903
      md5: 7a3138c15fa215b0e607287479211169
      expected_files: 268
      extract_to: processed
    sourcedata:
      file_id: 64877880
      filename: sourcedata.zip
      size_bytes: 5175273351
      md5: 74dabab47f477e5bc0510b1e2e705c5a
      expected_files: 536
      extract_to: source
  # Small metadata files are fetched by name from the article's file list (md5 from the API).
  metadata_files:
    - README.md
    - dataset_description.json
    - participants.tsv
    - participants.json
    - electrodes.tsv
    - events.tsv
    - events.json
    - task-MotorImagery_eeg.json
    - Code.zip

signal:
  sfreq: 250.0
  units_in_file: microvolt
  scale_to_volts: 1.0e-6
  # Preprocessed files are common-average referenced over 43 channels; re-referencing over the
  # 40 kept channels is a switch, off by default to stay comparable with the dataset paper.
  car40: false

channels:
  keep:
    - AF3
    - AF4
    - Fz
    - F1
    - F2
    - F3
    - F4
    - F5
    - F6
    - FCz
    - FC1
    - FC2
    - FC3
    - FC4
    - FC5
    - FC6
    - Cz
    - C1
    - C2
    - C3
    - C4
    - C5
    - C6
    - CP1
    - CP2
    - CP3
    - CP4
    - CP5
    - CP6
    - Pz
    - P3
    - P4
    - P5
    - P6
    - POz
    - PO3
    - PO4
    - PO5
    - PO6
    - CPz
  drop: [Fpz, Fp1, Fp2]
  mirror_pairs:
    - [AF3, AF4]
    - [F1, F2]
    - [F3, F4]
    - [F5, F6]
    - [FC1, FC2]
    - [FC3, FC4]
    - [FC5, FC6]
    - [C1, C2]
    - [C3, C4]
    - [C5, C6]
    - [CP1, CP2]
    - [CP3, CP4]
    - [CP5, CP6]
    - [P3, P4]
    - [P5, P6]
    - [PO3, PO4]
    - [PO5, PO6]
  mirror: false

labels:
  - {id: 0, name: rest, short: REST, event_code: "1", command: IDLE}
  - {id: 1, name: affected_hand, short: AH, event_code: "2", command: HAND_GRASP}
  - {id: 2, name: sixth_finger, short: SF, event_code: "3", command: SIXTH_FINGER_FLEX}

window:
  tmin: 1.0   # seconds after the event onset
  tmax: 5.0   # exclusive end; 4 s = 1000 samples at 250 Hz
  drop_if_boundary_inside: true

subjects:
  ids: [sub-01, sub-02, sub-03, sub-04, sub-05, sub-06, sub-07, sub-08, sub-09, sub-10, sub-11, sub-12,
        sub-13, sub-14, sub-15, sub-16, sub-17, sub-18, sub-19, sub-20, sub-21, sub-22, sub-23, sub-24]
  sessions: [pre, post, follow]
  runs: ["01", "02", "03", "04"]
  missing_sessions:
    follow: [sub-05, sub-17, sub-18, sub-20, sub-21]
  left_hemiplegic: [sub-03, sub-04, sub-05, sub-09, sub-11, sub-12, sub-17, sub-18, sub-24]
  bci_group: [sub-01, sub-02, sub-03, sub-04, sub-05, sub-06, sub-09, sub-10, sub-12, sub-15, sub-16,
              sub-18, sub-20, sub-23]

exclusions:
  sessions:
    - subject: sub-02
      session: follow
      reason: "Raw runs byte-identical to sub-02/post; preprocessed run 01 correlates at r=0.98 with post run 01."
  # Subjects that must always be on the same side of a cross-subject split.
  linked_subjects:
    - members: [sub-21, sub-22]
      reason: "Raw pre-session runs are byte-identical between the two subjects."

paths:
  processed_glob: "sub-*/*/sub-*_*_*_*_eeg.mat"
