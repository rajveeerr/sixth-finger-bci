# Hyperparameters fixed in the pre-registration (section 3.6) before prereg-v1: re-centring to
# the identity per subject, then tangent space and logistic regression as ts_lr.
method: rct_tslr
covariance: oas
tangent_space_metric: riemann
logreg: {C: 1.0, max_iter: 1000}
# Chosen once from target_weight_grid by scripts/select_transfer_hparams.py (P08 step 4.5).
target_weight: null
target_weight_grid: [1, 5, 20]
