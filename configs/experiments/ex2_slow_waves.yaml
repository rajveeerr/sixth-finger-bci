# Exploratory, added after the results (protocol §12, 2026-10-23): the raw recordings for AH vs
# SF, slow waves below 3 Hz and all 59 EEG channels, with central, posterior, eye-only and
# no-near-eye controls. Every setting was fixed before any score on runs 03-04 (run 2026-10-21;
# the alignment rule was amended before any score, see `amendments`) and is copied here
# unchanged. Read by scripts/ex2_slow_waves.py.
question: Does going back to the raw recordings, keeping (a) the slow waves below 3 Hz and/or (b)
  all 59 EEG channels, improve AH vs SF (T1_ah_vs_sf), pre, chrono split, per patient balanced accuracy?
  Fixed before looking at any result.
status: exploratory; every setting fixed here before any score on runs 03-04
task: T1_ah_vs_sf
classes: [1, 2]
session: pre
patients: the 22 with a usable pre session (configs/data.yaml exclusions)
train_runs: [1, 2]
test_runs: [3, 4]
trials: exactly the AH and SF trials of the published-file baseline for that window (the cached [1,
  5) windows; for [0, 4) those whose published window recut() also keeps); every raw arm uses the
  same trials, matched through the alignment check
windows_s:
  primary: [1.0, 5.0]
  secondary: [0.0, 4.0]
raw_source:
  archive: sourcedata.zip, figshare file 64877880, read by HTTP range requests (remotezip), one run
    at a time, deleted after cutting
  loader: mne.io.read_raw_eeglab(path, preload=True, uint16_codec='latin1')
  channels: 59 EEG rows; ECG and EOG excluded from every EEG arm; CPz (the online reference) restored
    as zeros, so the montage holds 60 rows
  events: 'the raw file''s own markers: 2 = AH cue, 3 = SF cue'
  detrend: each channel's mean over the run removed before filtering (DC offsets reach tens of mV)
  bad_channels: none removed or interpolated (raw as recorded); per-channel 8-30 Hz amplitude logged
    for description only
rereference: common average over the 60 rows (59 EEG + restored CPz), applied to each filtered window
  (spatial and temporal linear steps commute)
filters: mne.filter.filter_data defaults (FIR, firwin, Hamming, zero phase, automatic transition bands),
  on each continuous run before cutting
channel_sets:
  '40': configs/data.yaml channels.keep (the published set, includes CPz)
  '59': 'the 59 recorded EEG electrodes (CPz left out: after the common average it is minus the sum
    of the others)'
  central: [C1, C2, C3, C4, C5, C6, Cz, CP1, CP2, CP3, CP4, CP5, CP6, CPz]
  posterior: [POz, PO3, PO4, PO5, PO6]
  source_of_groups: scripts/check_visual_cue.py (results/summary/rq4_visual_cue_table.csv)
arms:
  B0: ts_lr (configs/models/ts_lr.yaml) on the published 40-channel windows; [1, 5) from the epoch
    cache (must reproduce rq4_visual_cue_decode.csv all_40 exactly), [0, 4) from recut()
  R40: ts_lr, raw 8-30 Hz, common average, the 40 published channels
  R59: ts_lr, raw 8-30 Hz, common average, the 59 EEG channels
  S59: 'slow waves: raw 0.1-3 Hz band-pass (one zero-phase FIR), common average, decimated to 10 Hz
    by keeping every 25th sample (the 3 Hz low-pass is the anti-alias filter), the window''s 40 samples
    per channel flattened, LinearDiscriminantAnalysis(solver=''lsqr'', shrinkage=''auto''); 59 channels'
  S_central: S59 on the 14 central channels
  S_posterior: S59 on the 5 parieto-occipital channels
  C59: mean of R59's and S59's predicted probabilities, fixed 50/50
  C_central: mean of R_central's and S_central's predicted probabilities, fixed 50/50
  descriptive:
    B0_central: B0 on the 14 central published channels (rq4 visual-cue value)
    B0_posterior: B0 on the 5 parieto-occipital published channels
    R_central: ts_lr, raw 8-30 Hz, central 14 (the R half of C_central)
    R40_535: 'ts_lr, raw 5-35 Hz (the published band), common average, 40 channels: isolates the authors''
      cleaning from the band change in R40'
    S_eog: 'the S59 recipe on the 4 EOG channels (not re-referenced): do the eyes alone tell the two
      cues apart below 3 Hz?'
tuning: 'none: shrinkage=''auto'' (Ledoit-Wolf) needs no choice, the combination weight is fixed at
  50/50, ts_lr keeps its pre-registered settings; nothing is chosen on runs 03-04 (and nothing needed
  the run 01 -> run 02 inner split)'
alignment_check:
  signal: raw, CPz restored, common average over the authors' 43 channels, 5-35 Hz, against the published
    file, 40 kept channels, [1, 5) s after each cue; computed from the stored raw windows ([0, 5)
    s at every raw cue)
  matching: 'pass 1: each cached published window against every raw cue of the same code in all four
    raw runs of the patient, lag 0, median-over-channels r; a match needs r > 0.5. Each published
    run must then come from a single raw run. Pass 2, for a window without a lag-0 match: that raw
    run is downloaded again and the published window is slid along it, through the run''s spatial
    map (below), between the raw cues its published neighbours matched; it is matched to the nearest
    raw cue of the same code at or before the best position, and the distance is its shift'
  direct_r: median over 40 channels of r at lag 0 (no fitting)
  lag_scan: lag of the best direct r within +/- 25 samples ([1.1, 4.9) s)
  mapped_r: the authors' manual cleaning (bad-channel interpolation, ICA) is a fixed spatial matrix
    per run, so a least-squares 43 -> 40 channel map is fitted on the run's other lag-0 trials and
    the trial is predicted; median over 40 channels
  pass: 'all of: every cached AH/SF window matched to a raw cue of the same code, one to one; each
    published run from one raw run, raw cues in the published order, and the published cue sequence
    an in-order subsequence of the raw one; every lag-0 match with best lag 0, mapped r > 0.9 for
    at least 95 % and > 0.5 for all; every pass-2 match with mapped r > 0.8, and a shift of more than
    2 samples only where the published file has a cut between the cue and the window start (and none
    where it has such a cut but no shift). Otherwise stop and report.'
  raw_arms_timing: raw windows are cut at the matched raw cue, so a trial whose published window was
    displaced by a cut is cut at its true time in the raw arms; B0 keeps the published windows unchanged
    (the existing pipeline)
  split_after_renumbering: trials keep their published run number for the split, so every arm has
    the same train and test trials as B0
amendments:
- '2026-10-21, after the first alignment pass and before any score: the first rule matched each published
  run only to the raw run with the same number at lag 0. It failed in two ways that the signals explain:
  sub-20''s published pre runs 01-03 are raw runs 02, 03 and 01 (cue sequences and signals match across
  runs), and 17 cached windows had no lag-0 match, 13 of them with a cut between the cue and the window
  start in the published file. The matching and pass rule above replace the first rule; a first replacement
  searched displaced windows only inside the stored raw windows and could not reach shifts beyond
  750 samples, so pass 2 now searches the continuous raw run. No other setting changed.'
stats:
  unit: patient
  paired: two-sided Wilcoxon (scipy, zero_method wilcox), uncorrected, descriptive
  ci: 95 % percentile bootstrap of the mean paired difference, 10000 resamples, seed 12345 (evaluation/stats.py
    paired_test)
budget: under about 90 CPU minutes; n_jobs 1, BLAS threads 1; one patient in memory
disk: stop if free space falls below 2 GB
